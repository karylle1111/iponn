<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Finance & Management System</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER WITH ACTION ICONS & BURGER NAV -->
  <header class="top-nav">
    <div class="nav-brand">
      <span class="brand-title">Finance & Account Hub</span>
      <span class="brand-subtitle" id="current-view-label">Main Page</span>
    </div>

    <!-- Right Header Controls -->
    <div class="nav-actions">
      <!-- Notification Icon Button -->
      <button class="nav-icon-btn" id="notif-btn" data-view="notifications" aria-label="Notifications" title="Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </button>

      <!-- Quick Profile Link Icon Button -->
      <button class="nav-icon-btn" id="header-profile-btn" data-view="profile" aria-label="Profile" title="Profile">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </button>

      <!-- Right-Side Burger Button -->
      <button class="burger-btn" id="burger-toggle" aria-label="Toggle Navigation Menu">
        <span class="burger-line"></span>
        <span class="burger-line"></span>
        <span class="burger-line"></span>
      </button>
    </div>
  </header>

  <!-- OVERLAY & RIGHT SLIDE-OUT DRAWER MENU -->
  <div class="nav-overlay" id="nav-overlay"></div>
  <nav class="side-drawer" id="side-drawer">
    <div class="drawer-header">
      <span class="drawer-title">Navigation</span>
      <button class="close-btn" id="drawer-close" aria-label="Close Menu">&times;</button>
    </div>

    <ul class="drawer-menu">
      <li class="menu-label">Main Modules</li>
      <li>
        <a href="#" class="menu-item active" data-view="main">
          <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
          Main Page
        </a>
      </li>
      <li>
        <a href="#" class="menu-item" data-view="savings">
          <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2h0V5z"></path></svg>
          Savings Tracker
        </a>
      </li>
      <li>
        <a href="#" class="menu-item" data-view="bills">
          <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
          Pay Bills Tracker
        </a>
      </li>
      <li>
        <a href="#" class="menu-item" data-view="expenses">
          <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          Expenses Tracker
        </a>
      </li>

      <li class="menu-divider"></li>
      <li class="menu-label">Account</li>

      <li>
        <a href="#" class="menu-item" data-view="profile">
          <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Profile
        </a>
      </li>

      <li class="menu-divider"></li>
      <li class="menu-label">Support & Feedback</li>

      <li>
        <a href="#" class="menu-item" data-view="report">
          <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          Report a Problem
        </a>
      </li>
      <li>
        <a href="#" class="menu-item" data-view="feedback">
          <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          Submit Feedback
        </a>
      </li>
      <li>
        <a href="#" class="menu-item" data-view="contact">
          <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          Contact Us
        </a>
      </li>
    </ul>
  </nav>

  <!-- MAIN VIEWPORT CONTENT -->
  <main class="main-viewport">

    <!-- Embedded Savings Tracker View -->
    <div id="savings-view" class="view-container">
      <iframe src="ipon.html" title="Savings Tracker - Ipon Management System" class="tracker-iframe" style="width:100%; height:82vh; border:none; border-radius:var(--radius-lg);"></iframe>
    </div>

    <!-- Embedded Pay Bills Tracker View -->
    <div id="bills-view" class="view-container">
      <iframe src="bills.html" title="Pay Bills Tracker" class="tracker-iframe" style="width:100%; height:82vh; border:none; border-radius:var(--radius-lg);"></iframe>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
